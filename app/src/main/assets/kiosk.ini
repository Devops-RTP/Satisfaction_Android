; =====================================================================
;  Satisfaction Kiosk - configuration
;
;  Location on the tablet (created automatically on first launch):
;    Internal storage/Android/data/ca.rtp.satisfaction/files/kiosk.ini
;
;  Edit it over USB (Windows Explorer / MTP) or with a file manager,
;  then in the app: tap the top-right corner 5 times > PIN > Reload settings.
;  Lines starting with ; or # are comments.
; =====================================================================

[general]
; Identifies where the tablet is. Sent with every response. No personal data is collected.
site_id = HQ-Lobby
; Leave blank to use the tablet's Android ID automatically.
device_id =
; PIN for the hidden admin menu (tap top-right corner 5 times).
admin_pin = 2468
; landscape | portrait | auto
orientation = landscape
; Seconds the "thank you" screen stays up (also blocks repeat taps).
thank_you_seconds = 4
; true = use Android screen pinning so users can't leave the app
; (enable Settings > Security > Pin windows / App pinning on the tablet first)
pin_screen = false

[display]
question = How was your experience today?
; Second line, e.g. for bilingual signage. Leave blank to hide.
question_secondary = Comment évaluez-vous votre expérience aujourd'hui?
thank_you = Thank you for your feedback!
thank_you_secondary = Merci de vos commentaires!
; true | false - show a word under each face
show_labels = true
label_1 = Very unsatisfied
label_2 = Unsatisfied
label_3 = Neutral
label_4 = Satisfied
label_5 = Very satisfied
; Hex colours
background_color = #FFFFFF
text_color = #212121

[database]
; Where responses are sent:
;   http       - POST JSON to a web API (recommended: no DB password on the tablet)
;   mssql      - Microsoft SQL Server (direct, via jTDS)
;   mysql      - MySQL / MariaDB (direct)
;   postgresql - PostgreSQL (direct)
;   none       - keep locally only (see [local] csv_backup)
type = none

; --- used by mssql / mysql / postgresql ---
host = 192.168.1.50
; blank = default port (1433 / 3306 / 5432)
port =
database = Satisfaction
; SQL Server named instance (optional), e.g. SQLEXPRESS
instance =
username = kiosk_writer
password = change_me
; Table must exist - see the sql/ folder for CREATE TABLE scripts.
table = dbo.SurveyResponses
; true = request/require an encrypted connection
use_ssl = false

; --- used by http ---
url = https://example.internal/api/survey
; Optional header sent with every request, e.g. X-Api-Key
api_key_header = X-Api-Key
api_key =

[queue]
; Responses are always saved on the tablet first, then uploaded.
; If the network/database is down they wait and retry automatically.
retry_seconds = 30
; Max responses per upload batch
batch_size = 50

[local]
; Also append every response to responses.csv next to this file.
csv_backup = true
